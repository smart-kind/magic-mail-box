<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>宿主 Demo — 消息中心多用户测试</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
        color: #1f2933;
        background: #f5f6f8;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── 顶部工具栏 ── */
      .toolbar {
        background: #1f2933;
        color: #fff;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }
      .toolbar-title {
        font-size: 14px;
        font-weight: 600;
        margin-right: auto;
      }
      .toolbar button {
        padding: 6px 14px;
        font-size: 13px;
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 4px;
        background: rgba(255,255,255,0.1);
        color: #fff;
        cursor: pointer;
        transition: background 0.15s;
      }
      .toolbar button:hover { background: rgba(255,255,255,0.2); }
      .toolbar button.primary { background: #1f6feb; border-color: #1f6feb; }
      .toolbar button.primary:hover { background: #1a5fd4; }

      /* ── 模式开关 ── */
      .mode-switch {
        display: inline-flex;
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 4px;
        overflow: hidden;
      }
      .mode-btn {
        padding: 5px 12px;
        font-size: 12px;
        border: none;
        background: transparent;
        color: rgba(255,255,255,0.7);
        cursor: pointer;
      }
      .mode-btn.active { background: rgba(255,255,255,0.2); color: #fff; }

      /* ── 当前用户栏 ── */
      .current-user-bar {
        display: none;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: rgba(255,255,255,0.7);
      }
      .current-user-bar .user-tag {
        font-weight: 600;
        color: #fff;
      }
      .current-user-bar button {
        padding: 3px 10px;
        font-size: 11px;
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 3px;
        background: transparent;
        color: rgba(255,255,255,0.85);
        cursor: pointer;
      }
      .current-user-bar button:hover { background: rgba(255,255,255,0.15); }

      /* ── iframe 工作区 ── */
      .workspace {
        flex: 1;
        display: flex;
        gap: 1px;
        background: #d1d5db;
        overflow: hidden;
      }
      .workspace:empty::after {
        content: '点击「打开消息中心」开始测试';
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        color: #9ca3af;
        font-size: 15px;
      }
      .panel {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: #fff;
      }
      .panel-header {
        background: #f0f1f3;
        padding: 6px 10px;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid #e4e7eb;
        flex-shrink: 0;
      }
      .panel-header .user-tag {
        font-weight: 600;
        color: #1f6feb;
      }
      .panel-header .close-btn {
        margin-left: auto;
        width: 20px;
        height: 20px;
        border: none;
        background: none;
        color: #6b7280;
        font-size: 16px;
        cursor: pointer;
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .panel-header .close-btn:hover { background: #e5e7eb; color: #dc2626; }
      .panel iframe {
        flex: 1;
        width: 100%;
        border: none;
      }

      /* ── 弹窗 ── */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.4);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }
      .modal-overlay.open { display: flex; }
      .modal {
        background: #fff;
        border-radius: 8px;
        width: 560px;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      }
      .modal-head {
        padding: 14px 20px;
        border-bottom: 1px solid #e4e7eb;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .modal-head h2 { font-size: 15px; margin: 0; }
      .modal-head .close-modal {
        border: none;
        background: none;
        font-size: 20px;
        cursor: pointer;
        color: #6b7280;
        padding: 0 4px;
      }
      .modal-body { padding: 16px 20px; }
      .modal-body h3 {
        font-size: 13px;
        color: #52606d;
        margin: 0 0 10px;
        padding-bottom: 6px;
        border-bottom: 1px solid #f0f1f3;
      }
      .modal-body h3:not(:first-child) { margin-top: 20px; }

      /* ── 表单 ── */
      label { display: block; font-size: 12px; margin-bottom: 3px; color: #52606d; }
      input, select {
        width: 100%;
        padding: 6px 8px;
        font-size: 13px;
        border: 1px solid #cbd2d9;
        border-radius: 4px;
      }
      .field { margin-bottom: 10px; }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .hint { font-size: 11px; color: #7b8794; margin-top: 4px; }
      .btn-row { display: flex; gap: 8px; margin-top: 10px; }
      .btn-row button {
        padding: 7px 14px;
        font-size: 13px;
        border: 1px solid #1f6feb;
        border-radius: 4px;
        background: #1f6feb;
        color: #fff;
        cursor: pointer;
      }
      .btn-row button:disabled { opacity: 0.5; cursor: default; }
      .btn-row button.secondary { background: #fff; color: #1f6feb; }

      /* ── 用户列表 ── */
      .user-list {
        margin-top: 10px;
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid #e4e7eb;
        border-radius: 4px;
        font-size: 12px;
        font-family: ui-monospace, Menlo, monospace;
      }
      .user-list:empty::after {
        content: '暂无用户，请先批量创建';
        display: block;
        padding: 12px;
        text-align: center;
        color: #9ca3af;
      }
      .user-list-item {
        padding: 5px 10px;
        border-bottom: 1px solid #f0f1f3;
      }
      .user-list-item:last-child { border-bottom: none; }

      /* ── 状态日志 ── */
      #status {
        margin-top: 10px;
        font-size: 11px;
        font-family: ui-monospace, Menlo, monospace;
        white-space: pre-wrap;
        max-height: 120px;
        overflow-y: auto;
        color: #3e4c59;
        border: 1px solid #e4e7eb;
        border-radius: 4px;
        padding: 8px;
      }
      #status:empty { display: none; }
      #status .err { color: #cf222e; }
      #status .ok { color: #1a7f37; }

      /* ── 打开消息中心弹窗 ── */
      .pick-form {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        margin-bottom: 12px;
      }
      .pick-form .field { flex: 1; margin-bottom: 0; }
      .pick-form button {
        padding: 6px 16px;
        font-size: 13px;
        border: 1px solid #1f6feb;
        border-radius: 4px;
        background: #1f6feb;
        color: #fff;
        cursor: pointer;
        white-space: nowrap;
      }
      .quick-users {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .quick-user {
        padding: 4px 10px;
        font-size: 12px;
        border: 1px solid #e4e7eb;
        border-radius: 999px;
        background: #fff;
        cursor: pointer;
        color: #4e5969;
      }
      .quick-user:hover { background: #f0f6ff; border-color: #1f6feb; color: #1f6feb; }
    </style>
  </head>
  <body>
    <!-- ── 顶部工具栏 ── -->
    <div class="toolbar">
      <span class="toolbar-title">消息中心</span>
      <div class="mode-switch">
        <button id="mode-host" class="mode-btn active">宿主模拟</button>
        <button id="mode-multi" class="mode-btn">多用户测试</button>
      </div>
      <div id="current-user-bar" class="current-user-bar">
        <span>当前用户：</span>
        <span id="current-user-name" class="user-tag">未选择</span>
        <button id="btn-switch-user">切换</button>
      </div>
      <button id="btn-config">环境配置</button>
      <button id="btn-open-mc" class="primary">打开消息中心</button>
    </div>

    <!-- ── iframe 工作区 ── -->
    <div class="workspace" id="workspace"></div>

    <!-- ── 环境配置弹窗 ── -->
    <div class="modal-overlay" id="modal-config">
      <div class="modal">
        <div class="modal-head">
          <h2>环境配置</h2>
          <button class="close-modal" data-close="modal-config">&times;</button>
        </div>
        <div class="modal-body">
          <h3>连接设置</h3>
          <div class="grid-2">
            <div class="field">
              <label for="cfg-server">JMAP 服务器地址</label>
              <input id="cfg-server" type="text" placeholder="http://localhost:8082" />
            </div>
            <div class="field">
              <label for="cfg-mc-url">消息中心入口地址</label>
              <input id="cfg-mc-url" type="text" placeholder="../message-center/dist/index.html" />
            </div>
            <div class="field">
              <label for="cfg-admin-user">管理员账号</label>
              <input id="cfg-admin-user" type="text" placeholder="admin@local.test" />
            </div>
            <div class="field">
              <label for="cfg-admin-pass">管理员密码</label>
              <input id="cfg-admin-pass" type="password" />
            </div>
          </div>
          <p class="hint">管理员凭证用于消息中心自动创建新用户。设置保存在 localStorage。</p>
          <div class="btn-row">
            <button id="btn-save-config">保存设置</button>
          </div>

          <h3>测试用户（可选，批量预建）</h3>
          <p class="hint">消息中心会自动创建用户，此处仅用于批量预建 demo 用户做测试。</p>
          <div class="btn-row">
            <button id="btn-create">批量创建 demo001 ~ demo100</button>
            <button id="btn-list-users" class="secondary">刷新用户列表</button>
          </div>
          <div class="user-list" id="user-list"></div>
          <div id="status"></div>
        </div>
      </div>
    </div>

    <!-- ── 打开消息中心弹窗 ── -->
    <div class="modal-overlay" id="modal-pick-user">
      <div class="modal">
        <div class="modal-head">
          <h2>打开消息中心</h2>
          <button class="close-modal" data-close="modal-pick-user">&times;</button>
        </div>
        <div class="modal-body">
          <div class="pick-form">
            <div class="field">
              <label for="pick-username">用户名</label>
              <input id="pick-username" type="text" placeholder="输入用户名，如 alice" />
            </div>
            <button id="btn-pick-open">打开</button>
          </div>
          <p class="hint">用户不存在时会自动创建。最多同时打开 4 个窗口。</p>

          <div class="quick-users" id="quick-users"></div>
        </div>
      </div>
    </div>

    <script>
      'use strict'

      // URL 格式：<消息中心地址>#/inbox?user=<用户名>&server=<JMAP地址>
      // 只传用户名，密码由消息中心自动派生。

      const LS_KEYS = {
        server: 'hostDemo.server',
        mcUrl: 'hostDemo.mcUrl',
        adminUser: 'hostDemo.adminUser',
        adminPass: 'hostDemo.adminPass',
        users: 'hostDemo.users',
        domain: 'hostDemo.domain',
        currentUser: 'hostDemo.currentUser',
        mode: 'hostDemo.mode',
      }

      // 消息中心读取的共享 localStorage 键
      const MC_LS_KEYS = {
        server: 'mc.server',
        adminUser: 'mc.adminUser',
        adminPass: 'mc.adminPass',
        domain: 'mc.domain',
      }

      const DEFAULTS = {
        server: 'http://localhost:8082',
        mcUrl: '../message-center/dist/index.html',
        adminUser: 'admin@local.test',
      }

      const USER_COUNT = 100
      const MAX_PANELS = 4

      // ── 工具函数 ──

      // ── 当前用户管理（宿主模拟模式）──
      // 现在从 localStorage 读取；未来嵌入业务系统时只需替换 getCurrentUser 的实现。

      function getCurrentUser() {
        return localStorage.getItem(LS_KEYS.currentUser) || ''
      }

      function setCurrentUser(username) {
        localStorage.setItem(LS_KEYS.currentUser, username)
        updateCurrentUserDisplay()
      }

      function clearCurrentUser() {
        localStorage.removeItem(LS_KEYS.currentUser)
        updateCurrentUserDisplay()
      }

      function updateCurrentUserDisplay() {
        const name = getCurrentUser()
        $('current-user-name').textContent = name || '未选择'
      }

      // ── 模式管理 ──

      function getMode() {
        return localStorage.getItem(LS_KEYS.mode) || 'host'
      }

      function setMode(mode) {
        localStorage.setItem(LS_KEYS.mode, mode)
        applyMode()
      }

      function applyMode() {
        const isHost = getMode() === 'host'
        $('mode-host').classList.toggle('active', isHost)
        $('mode-multi').classList.toggle('active', !isHost)
        $('current-user-bar').style.display = isHost ? 'flex' : 'none'
      }

      function demoName(n) { return 'demo' + String(n).padStart(3, '0') }
      // SECURITY: demo 用户口令可预测（AUDIT-26/AUDIT-03），仅限本地演示；对外应用随机强口令。
      function demoPassword(n) { return 'Demo' + String(n).padStart(3, '0') + '!Mc7' }

      function demoUsers(domain) {
        const users = []
        for (let n = 1; n <= USER_COUNT; n++) {
          users.push({ name: demoName(n), email: demoName(n) + '@' + domain, password: demoPassword(n) })
        }
        return users
      }

      // SECURITY: 本地演示通过 URL 传管理员凭证（AUDIT-08），仅限本机；凭证会进浏览器历史/共享链接。对外应改用 postMessage 或服务端会话。
      /** 生成消息中心 URL：传 user（用户名）、server，以及 admin 凭证供自动创建用户。 */
      function messageCenterUrl(base, username, server, adminUser, adminPass) {
        const hashBase = base.replace(/#.*$/, '')
        let url = hashBase + '#/inbox?user=' + encodeURIComponent(username)
          + '&server=' + encodeURIComponent(server)
        if (adminUser) url += '&adminUser=' + encodeURIComponent(adminUser)
        if (adminPass) url += '&adminPass=' + encodeURIComponent(adminPass)
        return url
      }

      function basicAuth(user, pass) { return 'Basic ' + btoa(user + ':' + pass) }

      async function jmapCall(server, auth, methodCalls) {
        const res = await fetch(server.replace(/\/+$/, '') + '/jmap/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: auth },
          body: JSON.stringify({
            using: ['urn:ietf:params:jmap:core', 'urn:stalwart:jmap'],
            methodCalls,
          }),
        })
        if (!res.ok) throw new Error('JMAP HTTP ' + res.status)
        return (await res.json()).methodResponses
      }

      async function fetchDomain(server, auth) {
        const [qr] = await jmapCall(server, auth, [['x:Domain/query', { filter: {} }, 'c1']])
        if (qr[0] !== 'x:Domain/query' || !qr[1].ids.length)
          throw new Error('未查询到域名（请先完成 Stalwart 初始化向导）')
        const [gr] = await jmapCall(server, auth, [['x:Domain/get', { ids: qr[1].ids }, 'c2']])
        const d = gr[1] && gr[1].list && gr[1].list[0]
        if (!d) throw new Error('无法获取域名详情')
        return { id: d.id, name: d.name }
      }

      function buildAccountSetArgs(users, domainId) {
        const create = {}
        for (const u of users) {
          create[u.name] = {
            '@type': 'User', name: u.name, domainId,
            credentials: { 0: { '@type': 'Password', secret: u.password } },
            roles: { '@type': 'User' }, permissions: { '@type': 'Inherit' },
            quotas: {}, memberGroupIds: {}, aliases: {},
            encryptionAtRest: { '@type': 'Disabled' },
          }
        }
        return { create }
      }

      // ── DOM 工具 ──

      const $ = (id) => document.getElementById(id)

      function getConfig() {
        return {
          server: $('cfg-server').value.trim() || DEFAULTS.server,
          mcUrl: $('cfg-mc-url').value.trim() || DEFAULTS.mcUrl,
          adminUser: $('cfg-admin-user').value.trim() || DEFAULTS.adminUser,
          adminPass: $('cfg-admin-pass').value,
        }
      }

      function loadConfig() {
        $('cfg-server').value = localStorage.getItem(LS_KEYS.server) || DEFAULTS.server
        $('cfg-mc-url').value = localStorage.getItem(LS_KEYS.mcUrl) || DEFAULTS.mcUrl
        $('cfg-admin-user').value = localStorage.getItem(LS_KEYS.adminUser) || DEFAULTS.adminUser
        $('cfg-admin-pass').value = localStorage.getItem(LS_KEYS.adminPass) || ''
      }

      function saveConfig() {
        const c = getConfig()
        // host-demo 自身的键
        localStorage.setItem(LS_KEYS.server, c.server)
        localStorage.setItem(LS_KEYS.mcUrl, c.mcUrl)
        // SECURITY: 本地演示管理员凭证明文存 localStorage（AUDIT-09），仅限本机；XSS 可读取。对外应改用 JMAP session token 或服务端会话。
        localStorage.setItem(LS_KEYS.adminUser, c.adminUser)
        localStorage.setItem(LS_KEYS.adminPass, c.adminPass)
        // 消息中心读取的共享键
        localStorage.setItem(MC_LS_KEYS.server, c.server)
        localStorage.setItem(MC_LS_KEYS.adminUser, c.adminUser)
        localStorage.setItem(MC_LS_KEYS.adminPass, c.adminPass)
      }

      function getUsers() {
        try { return JSON.parse(localStorage.getItem(LS_KEYS.users) || '[]') }
        catch { return [] }
      }

      // ── 状态日志 ──

      const statusEl = $('status')
      function logStatus(msg, cls) {
        const line = document.createElement('div')
        if (cls) line.className = cls
        line.textContent = msg
        statusEl.appendChild(line)
        statusEl.scrollTop = statusEl.scrollHeight
      }

      // ── 用户列表渲染 ──

      function renderUserList() {
        const list = $('user-list')
        const users = getUsers()
        list.innerHTML = ''
        for (const u of users) {
          const item = document.createElement('div')
          item.className = 'user-list-item'
          item.textContent = u.name
          list.appendChild(item)
        }
      }

      function renderQuickUsers() {
        const container = $('quick-users')
        container.innerHTML = ''
        const users = getUsers()
        for (const u of users.slice(0, 20)) {
          const btn = document.createElement('button')
          btn.className = 'quick-user'
          btn.textContent = u.name
          btn.addEventListener('click', () => {
            if (getMode() === 'host') {
              setCurrentUser(u.name)
            }
            openPanel(u.name)
            closeModal('modal-pick-user')
          })
          container.appendChild(btn)
        }
      }

      // ── 弹窗控制 ──

      function openModal(id) { $(id).classList.add('open') }
      function closeModal(id) { $(id).classList.remove('open') }

      document.querySelectorAll('.close-modal').forEach(btn => {
        btn.addEventListener('click', () => closeModal(btn.dataset.close))
      })
      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) closeModal(overlay.id)
        })
      })

      // ── 环境配置弹窗 ──

      $('btn-config').addEventListener('click', () => {
        renderUserList()
        statusEl.innerHTML = ''
        openModal('modal-config')
      })

      $('btn-save-config').addEventListener('click', () => {
        saveConfig()
        logStatus('设置已保存', 'ok')
      })

      for (const id of ['cfg-server', 'cfg-mc-url', 'cfg-admin-user', 'cfg-admin-pass']) {
        $(id).addEventListener('change', saveConfig)
      }

      // ── 批量创建用户 ──

      $('btn-create').addEventListener('click', async () => {
        const btn = $('btn-create')
        btn.disabled = true
        statusEl.innerHTML = ''
        try {
          saveConfig()
          const c = getConfig()
          if (!c.server) throw new Error('请填写服务器地址')
          if (!c.adminPass) throw new Error('请填写管理员密码')
          const auth = basicAuth(c.adminUser, c.adminPass)

          logStatus('查询域名…')
          const domain = await fetchDomain(c.server, auth)
          logStatus('域名：' + domain.name)

          // 缓存域名供消息中心使用
          localStorage.setItem(LS_KEYS.domain, domain.name)
          localStorage.setItem(MC_LS_KEYS.domain, domain.name)

          const users = demoUsers(domain.name)
          logStatus('批量创建 ' + users.length + ' 个用户…')
          const [setResp] = await jmapCall(c.server, auth, [
            ['x:Account/set', buildAccountSetArgs(users, domain.id), 'c3'],
          ])
          if (setResp[0] === 'error') throw new Error('Account/set 失败：' + JSON.stringify(setResp[1]))

          const created = Object.keys((setResp[1] && setResp[1].created) || {}).length
          const notCreated = (setResp[1] && setResp[1].notCreated) || {}
          const skipped = Object.keys(notCreated).filter(k => notCreated[k].type === 'primaryKeyViolation').length
          const failed = Object.entries(notCreated).filter(([, v]) => v.type !== 'primaryKeyViolation')

          logStatus('新建 ' + created + ' 个，已存在跳过 ' + skipped + ' 个', 'ok')
          for (const [k, v] of failed) logStatus('失败 ' + k + '：' + (v.description || v.type), 'err')
          if (failed.length) throw new Error('部分用户创建失败')

          localStorage.setItem(LS_KEYS.users, JSON.stringify(users))
          renderUserList()
          logStatus('完成', 'ok')
        } catch (err) {
          logStatus(String(err.message || err) +
            (String(err).includes('Failed to fetch') ? '（检查 CORS 设置）' : ''), 'err')
        } finally {
          btn.disabled = false
        }
      })

      $('btn-list-users').addEventListener('click', () => {
        renderUserList()
        const n = getUsers().length
        logStatus(n ? '已加载 ' + n + ' 个用户' : '暂无用户', n ? 'ok' : 'err')
      })

      // ── 打开消息中心 ──

      $('btn-open-mc').addEventListener('click', () => {
        const panels = document.querySelectorAll('.panel')
        if (panels.length >= MAX_PANELS) {
          alert('最多同时打开 ' + MAX_PANELS + ' 个消息中心窗口，请先关闭一些')
          return
        }
        // 宿主模拟模式：有当前用户直接打开，无则弹窗选
        if (getMode() === 'host') {
          const user = getCurrentUser()
          if (user) {
            openPanel(user)
            return
          }
        }
        // 多用户测试模式 或 宿主模拟无当前用户：弹窗选
        renderQuickUsers()
        $('pick-username').value = getMode() === 'host' ? '' : ''
        $('pick-username').focus()
        openModal('modal-pick-user')
      })

      // 输入用户名直接打开
      $('btn-pick-open').addEventListener('click', () => {
        const username = $('pick-username').value.trim()
        if (!username) { alert('请输入用户名'); return }
        if (getMode() === 'host') {
          setCurrentUser(username)
        }
        openPanel(username)
        closeModal('modal-pick-user')
      })

      // 回车打开
      $('pick-username').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault()
          $('btn-pick-open').click()
        }
      })

      // ── 模式开关 ──

      $('mode-host').addEventListener('click', () => setMode('host'))
      $('mode-multi').addEventListener('click', () => setMode('multi'))

      // ── 切换当前用户 ──

      $('btn-switch-user').addEventListener('click', () => {
        renderQuickUsers()
        $('pick-username').value = getCurrentUser()
        $('pick-username').focus()
        openModal('modal-pick-user')
      })

      // ── iframe 面板管理 ──

      function openPanel(username) {
        const panels = document.querySelectorAll('.panel')
        if (panels.length >= MAX_PANELS) {
          alert('最多同时打开 ' + MAX_PANELS + ' 个窗口')
          return
        }
        const c = getConfig()
        // 把管理员凭证和域名通过 URL 传给 iframe（跨域 localStorage 不共享）
        const domain = localStorage.getItem(LS_KEYS.domain) || ''
        const url = messageCenterUrl(c.mcUrl, username, c.server, c.adminUser, c.adminPass)
          + (domain ? '&domain=' + encodeURIComponent(domain) : '')

        const panel = document.createElement('div')
        panel.className = 'panel'

        const header = document.createElement('div')
        header.className = 'panel-header'
        // 用 DOM API + textContent 构建，避免 innerHTML 拼接用户名导致 XSS (AUDIT-10)
        const tagSpan = document.createElement('span')
        tagSpan.textContent = '消息中心'
        const userSpan = document.createElement('span')
        userSpan.className = 'user-tag'
        userSpan.textContent = username
        header.appendChild(tagSpan)
        header.appendChild(document.createTextNode(' '))
        header.appendChild(userSpan)

        const closeBtn = document.createElement('button')
        closeBtn.className = 'close-btn'
        closeBtn.title = '关闭'
        closeBtn.textContent = '×'
        closeBtn.addEventListener('click', () => panel.remove())
        header.appendChild(closeBtn)

        const iframe = document.createElement('iframe')
        iframe.src = url
        iframe.title = username
        // sandbox：允许脚本/同源 storage/表单/弹窗，禁止 iframe 导航父页面（AUDIT-11）
        iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups'

        panel.appendChild(header)
        panel.appendChild(iframe)
        $('workspace').appendChild(panel)
      }

      // ── 初始化 ──

      loadConfig()
      applyMode()
      updateCurrentUserDisplay()
    </script>
  </body>
</html>
